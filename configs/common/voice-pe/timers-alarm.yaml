# Local alarm and snooze adapted from the vendored ReSpeaker Lite timer package.
esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            setenv("TZ", id(saved_time_zone).c_str(), 1);
            tzset();

api:
  actions:
    - action: set_time_zone
      variables:
        posix_time_zone: string
      then:
        - lambda: |-
            setenv("TZ", posix_time_zone.c_str(), 1);
            tzset();
            id(saved_time_zone) = posix_time_zone;
            id(publish_current_time).execute();

globals:
  - id: saved_time_zone
    type: std::string
    restore_value: yes
    initial_value: '"UTC0"'
  # Time (epoch) at which a snoozed ring starts again, 0 = no snooze. Restored,
  # so a reboot during the snooze does not lose the alarm.
  - id: snooze_until
    type: time_t
    restore_value: yes
    initial_value: '0'

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: "*"
        then:
          - script.execute: check_alarm
    on_time_sync:
      - script.execute: publish_current_time

datetime:
  # schedule the alarm time from Home Assistant
  - platform: template
    icon: mdi:bell-ring
    name: "Alarm time"
    id: alarm_time
    type: time
    initial_value: "00:00:00"
    restore_value: true
    optimistic: true
    internal: false
    set_action:
      then:
        # A new alarm time abandons the snooze of the old one.
        - lambda: id(snooze_until) = 0;
        - switch.turn_on: alarm_on


switch:
  # Defines if alarm is active
  - platform: template
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    id: alarm_on
    icon: mdi:bell-badge
    name: "Alarm on"
    on_turn_on:
      - script.execute: control_leds
    on_turn_off:
      - lambda: id(snooze_until) = 0;
      - script.execute: control_leds
  # Lets "Snooze" stop a ring and start it again after "Snooze duration".
  - platform: template
    id: snooze_enabled
    name: "Snooze enabled"
    icon: mdi:alarm-snooze
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - micro_wake_word.enable_model: snooze
    on_turn_off:
      - lambda: id(snooze_until) = 0;
      - micro_wake_word.disable_model: snooze

number:
  # Nine minutes, as bedside clocks have done since the 1950s.
  - platform: template
    id: snooze_minutes
    name: "Snooze duration"
    icon: mdi:alarm-snooze
    optimistic: true
    restore_value: true
    initial_value: 9
    min_value: 1
    max_value: 60
    step: 1
    unit_of_measurement: min
    mode: box

binary_sensor:
  - platform: template
    id: snooze_pending
    name: "Snooze pending"
    icon: mdi:alarm-snooze
    lambda: return id(snooze_until) != 0;

button:
  # "Stop" is not listened for during a snooze, so a false "Stop" cannot cancel
  # a wake-up. Cancel a snooze from Home Assistant instead.
  - platform: template
    id: snooze_cancel
    name: "Cancel snooze"
    icon: mdi:alarm-off
    on_press:
      - lambda: id(snooze_until) = 0;

interval:
  # Starts the snoozed ring again. A snooze older than the 15 minute ring limit
  # (the device was off) is dropped instead of ringing late.
  - interval: 1s
    then:
      - lambda: |-
          if (id(snooze_until) == 0) return;
          auto now = id(homeassistant_time).now();
          if (!now.is_valid() || now.timestamp < id(snooze_until)) return;
          bool stale = now.timestamp - id(snooze_until) > 15 * 60;
          id(snooze_until) = 0;
          if (stale) {
            ESP_LOGW("snooze", "Snooze expired while the device was off");
            return;
          }
          id(timer_ringing).turn_on();

  - interval: 10s
    then:
      - if:
          condition:
            and:
              - voice_assistant.connected:
              - lambda: return !id(init_in_progress);
              - switch.is_off: master_mute_switch
              - not:
                  voice_assistant.is_running:
              - not:
                  micro_wake_word.is_running:
          then:
            - logger.log:
                level: WARN
                format: "Wake word detection stopped, restarting it"
            - micro_wake_word.start:

text_sensor:
  - platform: template
    name: "Current device time"
    id: current_time
    icon: mdi:clock

select:
  - platform: template
    optimistic: true
    name: "Alarm action"
    id: alarm_action
    icon: mdi:bell-plus
    options:
      - "Play sound"
      - "Send event"
      - "Sound and event"
    initial_option: "Play sound"
    restore_value: true

script:
  # Stops a ring after 15 minutes. timer_ringing's on_turn_off stops this script.
  - id: ring_timeout
    mode: restart
    then:
      - delay: 15min
      - switch.turn_off: timer_ringing

  # "Snooze" while ringing: stop the ring, and ring again after snooze_minutes.
  # Needs the clock, because the deadline is a time. Without the clock the ring
  # continues, so a snooze never loses an alarm.
  - id: snooze_ring
    then:
      - if:
          condition:
            lambda: return id(homeassistant_time).now().is_valid();
          then:
            - lambda: |-
                id(snooze_until) = id(homeassistant_time).now().timestamp +
                                   (time_t) id(snooze_minutes).state * 60;
            - switch.turn_off: timer_ringing
          else:
            - logger.log:
                level: WARN
                format: "Snooze ignored: the device clock is not set"

  - id: check_alarm
    then:
      - lambda: |-
          id(publish_current_time).execute();
          // Check alarm only after the clock has synchronized.
          if (!id(homeassistant_time).now().is_valid()) return;
          if (id(alarm_on).state) {
            auto alarm_dt = id(alarm_time).state_as_esptime();
            auto time_now = id(homeassistant_time).now();

            if (time_now.hour == alarm_dt.hour && time_now.minute == alarm_dt.minute &&
                time_now.second == alarm_dt.second) {
              auto action = id(alarm_action).current_option();
              if (action == "Play sound") {
                id(timer_ringing).turn_on();
              } else if (action == "Send event") {
                id(send_alarm_event).execute();
              } else if (action == "Sound and event") {
                id(timer_ringing).turn_on();
                id(send_alarm_event).execute();
              }
            }
          }

  - id: send_alarm_event
    then:
      - homeassistant.event:
          event: esphome.alarm_ringing
  - id: publish_current_time
    mode: single
    then:
      - lambda: |-
          // Publish the current time only when it changed
          static std::string last_time_string = "";
          auto time_now = id(homeassistant_time).now();
          if (!time_now.is_valid()) return;
          std::string current_time_string = time_now.strftime("%H:%M");
          if (current_time_string != last_time_string) {
            id(current_time).publish_state(current_time_string);
            last_time_string = current_time_string;
          }
