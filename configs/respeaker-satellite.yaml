substitutions:
  # Pinned upstream release 2026.10.3; see common/respeaker-lite/UPSTREAM.md.
  respeaker_lite_ref: 6d68e61f1d615c59bd7d47e8f4e8c09e53583892

packages:
  respeaker_satellite: !include common/respeaker-lite/base.yaml
  sound_sense: !include common/sound_sense.yaml
  # Start voice processing after BLE releases the shared Wi-Fi radio.
  va_connected_wait_for_ble:
    voice_assistant:
      on_client_connected:
        - wait_until:
            not: ble.enabled
        - delay: 2s

esphome:
  project:
    name: fixtse.Respeaker Lite Satellite
    version: 2026.3.1
  min_version: 2026.10.0
  name: respeaker-satellite
  friendly_name: respeaker-satellite
  name_add_mac_suffix: true
  on_boot:
    # Migrate the previously persisted HH:MM string once, after entity setup.
    - priority: -101
      then:
        - lambda: |-
            if (id(alarm_time_migrated)) return;
            const auto &value = id(saved_alarm_time);
            if (value.size() == 5 && value[2] == ':' &&
                isdigit(value[0]) && isdigit(value[1]) &&
                isdigit(value[3]) && isdigit(value[4])) {
              const int hour = std::stoi(value.substr(0, 2));
              const int minute = std::stoi(value.substr(3, 2));
              if (hour < 24 && minute < 60) {
                const bool was_enabled = id(alarm_on).state;
                auto call = id(alarm_time).make_call();
                call.set_time(hour, minute, 0);
                call.perform();
                if (!was_enabled) id(alarm_on).turn_off();
              }
            }
            id(alarm_time_migrated) = true;

globals:
  - id: saved_alarm_time
    type: std::string
    restore_value: yes
    initial_value: '"Unknown"'
  - id: alarm_time_migrated
    type: bool
    restore_value: yes
    initial_value: 'false'

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    icon: mdi:wifi
    unit_of_measurement: dB
    update_interval: 60s

# Preserve credential-free factory provisioning and the existing OTA URL.
api:
  encryption: !remove
  actions:
    # Compatibility with the existing HH:MM Home Assistant action.
    - action: set_alarm_time
      variables:
        alarm_time_hh_mm: string
      then:
        - lambda: |-
            if (alarm_time_hh_mm.size() != 5 || alarm_time_hh_mm[2] != ':' ||
                !isdigit(alarm_time_hh_mm[0]) || !isdigit(alarm_time_hh_mm[1]) ||
                !isdigit(alarm_time_hh_mm[3]) || !isdigit(alarm_time_hh_mm[4])) {
              ESP_LOGW("alarm", "Expected alarm time in HH:MM format");
              return;
            }
            const int hour = std::stoi(alarm_time_hh_mm.substr(0, 2));
            const int minute = std::stoi(alarm_time_hh_mm.substr(3, 2));
            if (hour > 23 || minute > 59) {
              ESP_LOGW("alarm", "Alarm time is out of range");
              return;
            }
            auto call = id(alarm_time).make_call();
            call.set_time(hour, minute, 0);
            call.perform();

ota:
  - platform: http_request
    id: ota_http_request

http_request:

update:
  - platform: http_request
    name: Firmware Update
    update_interval: 30min
    source: https://raw.githubusercontent.com/fixtse/esp-ota/refs/heads/main/ota/respeaker_lite_manifest.yml

improv_serial:

wifi:
  on_connect:
    - delay: 5s
    - ble.disable:
    - script.execute: control_leds
  on_disconnect:
    - ble.enable:

esp32_ble:

improv_ble:
  authorizer: user_button
  on_start:
    - lambda: id(improv_ble_in_progress) = true;
    - script.execute: control_leds
  on_provisioned:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds
  on_stop:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds

# Preserve the existing Home Assistant media player entity name.
media_player:
  - id: !extend external_media_player
    name: "None"

# SoundSense consumes raw 32-bit microphone frames, before 16 kHz resampling.
microphone:
  - id: !extend i2s_mics_raw
    on_data:
      - script.execute:
          id: process_audio_data
          audio_data: !lambda return x;
