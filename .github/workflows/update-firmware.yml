name: Update ESPHome firmware

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-firmware.yml'
      - '.github/actions/notify-telegram/**'
      - 'configs/**'
      - 'scripts/*.ts'
      - 'firmware_list.txt'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the latest release was already built
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: esphome-firmware
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check firmware publication logic
        run: node --test scripts/*.test.ts
      - name: Detect release and select configurations needing builds
        id: release
        uses: actions/github-script@v7
        env:
          FORCE: ${{ github.event_name == 'push' || inputs.force || false }}
        with:
          script: |
            const fs = require('fs');
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: 'esphome', repo: 'esphome'
            });
            const version = release.tag_name.replace(/^v/, '');
            if (release.draft || release.prerelease || !/^\d{4}\.\d+\.\d+$/.test(version)) {
              throw new Error(`Unexpected stable release: ${release.tag_name}`);
            }
            const readVersion = path => fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : '';
            const legacyVersion = readVersion('.esphome-version');
            const configurations = fs.readFileSync('firmware_list.txt', 'utf8').split(/\r?\n/)
              .filter(line => line.trim() && !line.trim().startsWith('#'))
              .map(line => {
                const fields = line.split(',').map(field => field.trim());
                if (fields.length !== 4 || fields.some(field => !/^[A-Za-z0-9_-][A-Za-z0-9_.-]*$/.test(field))) {
                  throw new Error(`Invalid firmware list entry: ${line}`);
                }
                const [config, binary, manifest, node] = fields;
                return { config, binary, manifest, node };
              });
            if (!configurations.length) throw new Error('Firmware list is empty');
            for (const key of ['config', 'binary', 'manifest']) {
              if (new Set(configurations.map(entry => entry[key])).size !== configurations.length) {
                throw new Error(`Duplicate ${key} in firmware list`);
              }
            }
            const pending = configurations.filter(entry => process.env.FORCE === 'true' ||
              !fs.existsSync(`ota/releases/${entry.manifest}`) ||
              (readVersion(`firmware-versions/${entry.config}.txt`) || legacyVersion) !== version);
            core.setOutput('version', version);
            core.setOutput('build', pending.length > 0);
            core.setOutput('matrix', JSON.stringify({ include: pending }));
            core.info(`ESPHome ${version}: ${pending.length} configurations need builds`);

  build:
    needs: detect
    if: needs.detect.outputs.build == 'true'
    name: Build ${{ matrix.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile firmware and update its manifest
        env:
          ESPHOME_VERSION: ${{ needs.detect.outputs.version }}
          FIRMWARE_CONFIG: ${{ matrix.config }}
        run: node scripts/build-firmware.ts "$ESPHOME_VERSION" "$FIRMWARE_CONFIG"
      - name: Upload successful firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.config }}
          if-no-files-found: error
          retention-days: 7
          path: |
            built/ota/${{ matrix.binary }}
            built/ota/${{ matrix.manifest }}
            built/firmware-versions/${{ matrix.config }}.txt

  publish:
    needs: [detect, build]
    if: ${{ always() && !cancelled() && needs.detect.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Download successful builds even if other builds failed
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: incoming
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish OTA release assets and update manifests
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          ESPHOME_VERSION: ${{ needs.detect.outputs.version }}
        run: node scripts/publish-firmware.ts "$ESPHOME_VERSION" incoming
      - name: Commit and push successful builds only
        env:
          ESPHOME_VERSION: ${{ needs.detect.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MIGRATIONS: ${{ steps.publication.outputs.migrations }}
        run: |
          if [ ! -d incoming/firmware-versions ]; then
            echo 'No successful builds to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ota/ firmware-versions/
          if ! git diff --cached --quiet; then
            if [ "$MIGRATIONS" != '0' ]; then
              git commit -m "Enlarge HTTP buffers for firmware updates"
            else
              git commit -m "Update successful firmware builds for ESPHome ${ESPHOME_VERSION}"
            fi
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

  notify:
    needs: [detect, build, publish]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect failed builds and stages, including timeouts
        id: failures
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              filter: 'latest',
              per_page: 100
            });
            const failed = jobs.filter(job =>
              ['failure', 'timed_out', 'startup_failure'].includes(job.conclusion));
            core.setOutput('subject', failed.length
              ? failed.map(job => `${job.name}: ${job.conclusion}`).join('\n')
              : 'Firmware workflow failed; see the run logs');
      - name: Notify Telegram of all failures
        uses: ./.github/actions/notify-telegram
        with:
          bot-token: ${{ env.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ env.TELEGRAM_CHAT_ID }}
          subject: ${{ steps.failures.outputs.subject }}
          version: ${{ needs.detect.outputs.version }}
